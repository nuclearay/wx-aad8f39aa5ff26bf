<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clearwater Weather</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1220;--card:#141d2f;--line:#22304a;--tx:#eef2f7;--mut:#9fb0c8;--acc:#7dd3fc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top) + 4px) 7px calc(env(safe-area-inset-bottom) + 6px)}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hdr h1{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .upd{font-size:12px;color:var(--mut)}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;font-size:16px;width:34px;height:30px;cursor:pointer}
.btn.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.card{background:var(--card);border:.5px solid var(--line);border-radius:10px;padding:7px 9px}
.alerts{display:flex;flex-direction:column;gap:3px;margin-bottom:3px}
.alerts:empty{display:none}
.alert{border-radius:8px;padding:5px 8px;font-size:13px;cursor:pointer;border-left:4px solid}
.alert.Minor{background:#3a2e0b;border-color:#f59e0b}
.alert.Moderate{background:#3d1f0b;border-color:#f97316}
.alert.Severe,.alert.Extreme{background:#3f0d12;border-color:#ef4444}
.alert.Unknown{background:#1e293b;border-color:#94a3b8}
.alert b{font-weight:700}.alert .ex{color:#e5d3a8;font-size:12px}
.alert .desc{display:none;white-space:pre-wrap;font-size:12px;margin-top:4px;color:#f1e7cf;max-height:40vh;overflow:auto}
.alert.open .desc{display:block}
.now{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;margin-bottom:3px}
.now .big{font-size:48px;font-weight:800;line-height:1;letter-spacing:-2px}
.now .ico{font-size:30px}
.now .lines div{font-size:14px}
.now .obs{grid-column:1/-1;font-size:12px;color:#cdd7e5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line);padding-top:2px;margin-top:0}
.now .obs.stale{opacity:.5}
.now .note{grid-column:1/-1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.now .note[hidden]{display:none}
.chip{display:inline-block;padding:0 5px;border-radius:5px;font-weight:700;color:#0b1220;font-size:11px}
.now .obs b{color:#fff}
.mode{flex:none;background:#1c2a44;border:1px solid #33507a;color:#cfe3ff;border-radius:999px;font-size:12px;font-weight:600;padding:2px 9px;height:24px;cursor:pointer}
.mode.here{background:#123a2c;border-color:#2f8f6a;color:#c7f5df}
.now .mid{display:flex;align-items:center;justify-content:center;gap:10px}.now .lines{text-align:center}
.now .cond{font-size:18px;font-weight:700;line-height:1.1;display:flex;align-items:center;gap:5px;white-space:nowrap}
.now .cond .ci{display:block;font-size:34px;line-height:1.1;order:2}
.now .lines div.fl{font-size:17px}
.now .lines div.hl{font-size:16px}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:3px}
.tile{background:var(--card);border:.5px solid var(--line);border-radius:9px;padding:5px 7px;min-height:66px}
.tile h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:600;margin-bottom:2px}
.tile .v{font-size:17px;font-weight:700;line-height:1.15}
.tile .l{font-size:12px;color:#cdd7e5;line-height:1.3}
.tile.wide{grid-column:span 2}
.pill{display:inline-block;padding:0 6px;border-radius:6px;font-weight:700;color:#0b1220}
.err{color:#fca5a5;font-size:12px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:1px 2px 2px;font-weight:600}
.hr{flex:0 0 52px;background:var(--card);border:.5px solid var(--line);border-radius:8px;text-align:center;padding:4px 0;font-size:12px}
.hr .t{color:var(--mut)}.hr .i{font-size:18px;line-height:1.3}.hr .tp{font-weight:700;font-size:14px}.hr .p{color:var(--acc)}
#days .d{display:grid;grid-template-columns:3.7em 1.35em minmax(0,1fr) 3.75em 5.25em;column-gap:.25em;align-items:center;padding:0 2px;line-height:18px;border-bottom:1px solid var(--line);font-size:14px}#days .d>*{white-space:nowrap;overflow:hidden;min-width:0}#days .d>b{text-align:right;padding-right:1px}#days .d .i{text-align:center;line-height:1}#days .d .p,#days .d .hl{text-align:right;font-variant-numeric:tabular-nums}
.days .d:last-child{border-bottom:0}
#days.dfit .d{grid-template-columns:3.7em 1.35em minmax(0,1fr) 3.75em 5.25em;column-gap:.25em;overflow:hidden;line-height:1.1!important;font-size:var(--df)}
#days.dfit .d{align-items:center}#days.dfit .d>*{white-space:nowrap;line-height:1;overflow:hidden;align-self:center}#days.dfit .d>b{font-size:1em;justify-self:stretch;text-align:right;padding-right:1px}#days.dfit .i{font-size:1.2em;justify-self:center;display:inline-flex;align-items:center;justify-content:center;line-height:1;height:1.2em;width:100%}#days.dfit .c{font-size:.88em;min-width:0;padding-left:2px;text-align:left;text-overflow:ellipsis}#days.dfit .p{font-size:.9em;justify-self:stretch;text-align:right;font-variant-numeric:tabular-nums}#days.dfit .hl{font-size:1em;justify-self:stretch;text-align:right;font-variant-numeric:tabular-nums}
.days .i{font-size:15px;text-align:center}.days .d>b{text-align:right}.days .p{color:var(--acc);text-align:right;font-variant-numeric:tabular-nums}.days .hl{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.days .hl span{color:var(--mut);font-weight:400}
.days .c{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px;text-align:left}
a{color:var(--acc)}
.sky24{padding:4px 6px 5px;margin-bottom:3px}
.sky24{position:relative}
.sky24 svg{display:block;width:100%;height:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:crosshair}
.xtip{position:absolute;pointer-events:none;background:rgba(8,13,24,.94);border:1px solid #3b4d6b;border-radius:7px;padding:4px 7px;font-size:12px;line-height:1.35;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:5}
.xtip[hidden]{display:none}
.xtip .xt{font-weight:700;color:#fff;margin-bottom:1px}
.xtip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.xtip b{font-weight:700}
.sky24 .sunov .sl{justify-content:space-evenly!important;align-items:center}.sky24 .sl{display:flex;justify-content:space-between;font-size:13px;padding:2px 4px 0;white-space:nowrap}.sky24 .sl .tw{color:var(--mut);font-size:12px}
.skyw{position:relative}.sky24 svg.sic{display:inline-block;width:16px;height:16px;vertical-align:-3px;cursor:default}.sunov{position:absolute;left:0;right:0;pointer-events:none}.sunov .sl,.sunov .ml{padding-top:0!important}
.sky24 svg.az{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-left:3px}html.size-big .sky24 .mev{margin:0}.sky24 .mev{margin:0 2px}.sky24 .ml.mlr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;white-space:nowrap}.sky24 .mlr>:first-child{justify-self:center}.sky24 .mlr>:last-child{justify-self:center}.sky24 .mlr .mc{padding:0 4px}.sky24 .ml{font-size:12px;color:#cdd7e5;padding:2px 4px 0;display:flex;justify-content:space-between}
.ltg{display:grid;grid-template-columns:84px 1fr 104px;gap:8px;align-items:center;margin-bottom:6px;border-color:#a16207;background:#1f1a0e}
.ltg[hidden]{display:none}
.ltg svg{width:84px;height:84px;display:block}
.ltg .ll{min-width:0}
.ltg .ll div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltg .lr{display:flex;flex-direction:column;gap:6px;align-self:center}
.ltgbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70px;border-radius:14px;background:linear-gradient(#facc15,#d97706);color:#1a1205!important;text-decoration:none!important;font-weight:800;font-size:15px;line-height:1.1;box-shadow:0 2px 8px #0008,inset 0 1px 0 #fff6;border:1px solid #fde68a}
.ltgbtn .bi{font-size:24px;line-height:1}
.ltgbtn:active{filter:brightness(.88);transform:translateY(1px)}
.ltg .lr .mini{min-height:44px;font-size:12.5px;font-weight:700;border-radius:10px;padding:2px 4px}
/* enlarge hit areas without changing layout */
.mode,.btn,.rcap a,.rcap .x,.rlink{position:relative}
.mode::after,.btn::after,.rcap a::after,.rcap .x::after,.rlink::after{content:'';position:absolute;inset:-10px -6px}
.ltg .ll div{font-size:13px;line-height:1.4}
.ltg .lt{font-size:15px!important;font-weight:700;color:#fde047}
.ltg .lk{display:flex;gap:10px;align-items:center}
.mini{background:#2a2410;border:1px solid #a16207;color:#fde68a;border-radius:6px;font-size:12px;padding:1px 6px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:5px}
.tg>div{min-width:0;flex:1}
#t-pv .l{white-space:nowrap}
#t-rain,#t-rain h3{color:#38bdf8}#t-hum h3{color:#3b9fd8}#t-uv .v .pill,#t-aqi .v .pill{min-width:2.4em;text-align:center;box-sizing:border-box}#t-wind h3{color:#2dd4bf}#daysky{margin-top:6px}.dnvs{display:flex;gap:6px;margin-left:auto}.dnv{background:#1b2740;color:#e2e8f0;border:1px solid #2c3b58;border-radius:8px;width:34px;height:32px;font-size:22px;line-height:1;padding:0;cursor:pointer}.dnv[disabled]{opacity:.25;cursor:default}@keyframes dsl{from{transform:translateX(40%);opacity:0}to{transform:none;opacity:1}}@keyframes dsr{from{transform:translateX(-40%);opacity:0}to{transform:none;opacity:1}}#mdet.dsl>*{animation:dsl .28s ease-out}#mdet.dsr>*{animation:dsr .28s ease-out}#mdet{overflow-x:hidden}.dic{display:grid;grid-template-columns:repeat(12,1fr);margin:0 1.6%;text-align:center;font-size:17px;line-height:1.3}html.size-big .dic{font-size:22px}html.size-big #mdet:has(#daysky){zoom:1}
#mdet{position:fixed;inset:0;z-index:999;background:#0b1220;overflow:auto;padding:8px 12px 12px}#mdet[hidden]{display:none}
.mdls{margin-top:8px;background:var(--card);border-radius:14px;padding:4px 12px}.mdl{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #22304a;font-size:14px}.mdl:last-child{border-bottom:0}.mdl span{color:#9fb0c8}.mdl b{text-align:right}
#poldet{position:fixed;inset:0;z-index:999;background:#0b1220;overflow:auto;padding:8px 12px 12px}#poldet[hidden]{display:none}
.pdt{display:flex;align-items:center;gap:10px;margin-bottom:4px}.pdx{background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:2px 6px;cursor:pointer}
.pdtt{font-size:20px;font-weight:700}.pdu{font-size:12px;color:#cdd7e5}
.pds{margin-top:6px}.pdh{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;margin-bottom:4px}
.pdr{display:flex;gap:6px}.pdc{flex:1;background:var(--card);border:1.5px solid transparent;border-radius:22px;text-align:center;padding:6px 0 4px}.pdc.td{border-color:#e5edf7}
.pdv{font-size:13px;font-weight:700}.pdw{font-size:11px;color:#cdd7e5;white-space:nowrap}
.pdb{width:24px;height:84px;margin:4px auto;background:#e5edf7;border-radius:12px;position:relative;overflow:hidden}.pdb i{position:absolute;left:0;right:0;bottom:0;border-radius:12px}
.pdn{font-size:12px}.pdh svg{flex:none}.pdp{flex:1;min-width:0;margin-left:8px;font-size:12px;font-weight:400;color:#9fb0c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prings{display:flex;justify-content:space-between;margin:1px 0 2px}.pring{flex:1;text-align:center;line-height:1.1}.pring svg{display:block;margin:0 auto}.pring .pv{font-size:12px;font-weight:700;color:#fff;margin-top:-4px}.pring .pw{font-size:11px;color:#cdd7e5}
#t-aqi{position:relative}#t-aqi .aqg{position:absolute;top:7px;right:6px}
.tg svg,.now svg{flex:none;display:block}
.radar{padding:0;overflow:hidden;margin-bottom:4px}
.radar[hidden]{display:none}
.rmap{display:block;position:relative;height:var(--rh,178px);overflow:hidden;background:#0e1626;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rmap img{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none}
.rmap .bm{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.95) saturate(.5)}
.rmap .rx{opacity:.85}
.rmap svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.rcap{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:3px 8px;color:#cdd7e5}
.rcap .x{background:none;border:0;color:var(--mut);font-size:15px;padding:0 4px;cursor:pointer}
.rlink{float:right;text-transform:none;letter-spacing:0;color:var(--acc);font-weight:600}
#t-rain{cursor:pointer}
#grid{grid-template-columns:repeat(5,1fr)}#grid #t-rain{grid-column:span 2}#grid #t-pol{grid-column:span 3;display:flex;flex-direction:column;justify-content:center}#t-pol .pring{min-width:0}#t-pol .pring svg{width:100%;max-width:74px;height:auto}#t-pol .prings{gap:2px}
#t-rain .v{font-size:14px}#t-rain .l{font-size:11px}#t-rain .tg svg{width:26px;height:auto}
#t-rain .tg{flex-direction:row-reverse;justify-content:flex-end;align-items:flex-start;gap:5px}#t-rain .tg svg{width:20px;margin-top:1px}#t-rain .v{font-size:12.5px;line-height:1.15}#t-rain .l{font-size:10.5px;line-height:1.25}#t-rain,#t-pol{padding:3px 6px;min-height:0}#t-rain h3{margin-bottom:1px}#t-pol .pring svg{max-width:62px}#t-pol .prings{margin:0}
#t-rain{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;column-gap:12px;align-items:start}#t-rain>h3{grid-column:1;grid-row:1;margin:0}#t-rain .tg{display:contents}#t-rain .tg>div{grid-column:2;grid-row:1/span 2;padding-left:4px}#t-rain .tg svg{grid-column:1;grid-row:2;width:auto;height:54px;margin:1px auto 0;justify-self:center}
#t-rain{grid-template-columns:1fr auto;column-gap:4px}#t-rain .tg>div{grid-column:1;grid-row:2;padding-left:0;min-width:0}#t-rain .tg svg{grid-column:2;grid-row:1/span 2;height:69px;align-self:center;margin:0}#t-rain .tg>div>*{white-space:nowrap}
#t-rain{grid-template-columns:auto 1fr;column-gap:8px}#t-rain>h3{grid-column:2}#t-rain .tg>div{grid-column:2}#t-rain .tg svg{grid-column:1}
#t-rain{column-gap:5px}#t-rain .v{font-size:11.5px}
.tile.mt{display:flex;flex-direction:column;align-items:center;text-align:center;padding:5px 3px;min-width:0}
.mt .tg,.mt .tg>div{display:contents}
.mt h3{font-size:calc(9.5px*var(--mh,1));letter-spacing:.2px;white-space:nowrap;order:0;margin-bottom:1px}
.mt .v{order:1;font-size:calc(16px*var(--mv,1))}#grid .mt .v *,#grid .mt .l *{font-size:inherit}#grid .tile.mt>*,#grid .mt .tg>*,#grid .mt .tg>div>*{flex-shrink:0}.mt>svg,.mt .tg>svg,.mt #psp{order:2;margin:2px 0}
.mt svg{height:calc(32px*var(--mg,1));width:auto;max-width:100%}
.mt .l{order:3;font-size:calc(10.5px*var(--ml,1));line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#t-aqi.mt .aqg{position:static}
.foot{font-size:11px;color:var(--mut);text-align:center;margin-top:4px}

/* top-area fit: one scale var per role, set by topFit() */
.hdr .mode{font-size:calc(12px*var(--hs,1));height:calc(24px*var(--hs,1));padding:0 calc(9px*var(--hs,1))}
.hdr h1{font-size:calc(16px*var(--hs,1))!important}
.hdr .upd{font-size:calc(12px*var(--hs,1))!important}
.hdr .btn{font-size:calc(16px*var(--hs,1));width:calc(34px*var(--hs,1));height:calc(30px*var(--hs,1))}
#szb{font-size:calc(12px*var(--hs,1))!important;height:calc(24px*var(--hs,1))!important;min-width:calc(52px*var(--hs,1))!important;padding:0 calc(10px*var(--hs,1))!important}
#now .big{font-size:calc(48px*var(--nb,1))!important}
#now .lines div.fl,#now .lines div.hl{font-size:calc(16.5px*var(--nl,1))!important}

#now .cond .ci{font-size:calc(34px*var(--nc,1))!important}
html.size-big #now .cond{font-size:calc(16px*var(--nc,1))!important;max-width:none!important}
html.size-big #now .cond .ci{font-size:calc(30px*var(--nc,1))!important}html.size-big #now.tf .cond{line-height:1!important}html.size-big #now.tf .cond .ci{line-height:1!important}
#now>svg{width:calc(84px*var(--ng,1));height:calc(46px*var(--ng,1))}

<body>
<div class="hdr">
  <button class="mode" id="mode" aria-label="Switch Home/Here">🏠 Home</button>
  <h1 id="place">📍 Clearwater, FL</h1>
  <span class="upd" id="upd">loading…</span>
  <button class="btn" id="rf" aria-label="Refresh">↻</button>
  <button id="szb" aria-label="Change dashboard size">SMALL</button>
</div>
<div class="alerts" id="alerts"></div>
<div class="card ltg" id="ltg" hidden></div>
<div class="card now" id="now"><div class="mut">Loading current conditions…</div></div>
<div class="sec lgd lgf"><span>Today</span><span>&nbsp;·&nbsp;</span><span style="color:#fb7185">temp</span><span>&nbsp;·&nbsp;</span><span style="color:#fb923c">┄ feels</span><span>&nbsp;·&nbsp;</span><span style="color:#6bbf59">dew</span><span>&nbsp;·&nbsp;</span><span style="color:#fbbf24">sun W/m²</span><span>&nbsp;·&nbsp;</span><span><span style="color:#2dd4bf">wind</span> <span style="text-transform:none;font-weight:400;color:#5eead4">(┄ gusts)</span></span></div>
<div class="card sky24" id="sky24"><div class="mut">Loading…</div></div>
<div id="poldet" hidden></div>
<div id="mdet" hidden></div>
<div class="grid" id="grid">
  <div class="tile mt" id="t-hum" role="button" tabindex="0" style="cursor:pointer" onclick="mdOpen('humidity')" onkeydown="if(event.key==='Enter')mdOpen('humidity')"><h3>💧 Humidity</h3><div class="l mut">…</div></div>
  <div class="tile mt" id="t-wind" role="button" tabindex="0" style="cursor:pointer" onclick="mdOpen('wind')" onkeydown="if(event.key==='Enter')mdOpen('wind')"><h3>💨 Wind</h3><div class="l mut">…</div></div>
  <div class="tile mt" id="t-pv" role="button" tabindex="0" style="cursor:pointer" onclick="mdOpen('pressure')" onkeydown="if(event.key==='Enter')mdOpen('pressure')"><h3>🧭 Pressure</h3><div class="l mut">…</div></div>
  <div class="tile mt" id="t-uv" role="button" tabindex="0" style="cursor:pointer" onclick="mdOpen('uv')" onkeydown="if(event.key==='Enter')mdOpen('uv')"><h3>☀️ UV</h3><div class="l mut">…</div></div>

function xhShow(el,clientX){

  const set=(id,a)=>{const n=svg.querySelector('#'+id);for(const q in a)n.setAttribute(q,a[q])};
  set('xhl',{x1:xx,x2:xx});set('xht',{cx:xx,cy:D.ty(D.tp[k])});set('xhf',{cx:xx,cy:D.ty(D.fl[k])});
  if(D.dw[k]!=null)set('xhd',{cx:xx,cy:D.ty(D.dw[k]),visibility:'visible'});else set('xhd',{visibility:'hidden'});
  svg.querySelector('#xh').setAttribute('visibility','visible');

   `<div><i style="background:#6bbf59"></i>Dew <b>${r(D.dw[k])}°</b>${D.wb[k]!=null?` · WB <b>${r(D.wb[k])}°</b>`:''}</div><div><i style="background:#38bdf8"></i>Rain <b>${D.pr[k]??0}%</b></div>`+
   (D.sw[k]>0||D.uvh[k]>0?`<div><i style="background:#fbbf24"></i>Sun <b>${Math.round(D.sw[k])}</b> W/m²</div><div><i style="background:${uvInfo(D.uvh[k])[1]}"></i>UV <b>${(+D.uvh[k]).toFixed(1)}</b></div>`:`<div><i style="background:#64748b"></i>Sun <b>0</b> · UV <b>0</b></div>`)+
   `<div><i style="background:#2dd4bf"></i>Wind <b>${r(D.ws[k])}</b> g${r(D.wg[k])} ${card(D.wd[k])}</div>`;

// ===== Local obs: nearest NWS observation station (Home = KCLW), measured values shown as a check on the model =====
const OBS={html:'<span class="mut">Local obs loading…</span>',stale:false,stations:null};
const NWSH={headers:{Accept:'application/geo+json'}};
const miles=(la1,lo1,la2,lo2)=>{const t=Math.PI/180,a=Math.sin((la2-la1)*t/2)**2+Math.cos(la1*t)*Math.cos(la2*t)*Math.sin((lo2-lo1)*t/2)**2;return 2*3958.8*Math.asin(Math.sqrt(a))};
function setObs(html,stale){OBS.html=html;OBS.stale=!!stale;const o=$('obs');if(o){o.innerHTML=html;o.classList.toggle('stale',!!stale)}}
async function obsStations(){
  if(OBS.stations)return OBS.stations;
  if(LOC.mode==='home')return OBS.stations=[HOME.obsStation];
  const pt=LOC.points||await getJSON('https://api.weather.gov/points/'+LAT.toFixed(4)+','+LON.toFixed(4),NWSH);
  const st=await getJSON(pt.properties.observationStations+'?limit=8',NWSH);
  return OBS.stations=(st.features||[]).map(f=>({id:f.properties.stationIdentifier,d:miles(LAT,LON,f.geometry.coordinates[1],f.geometry.coordinates[0])})).sort((a,b)=>a.d-b.d).filter(x=>x.id!=='KPIE').slice(0,3).map(x=>x.id);

async function loadObs(){
  try{
    const ids=await obsStations();let p=null,g=null,id=null;
    for(const s of ids){const o=await getJSON('https://api.weather.gov/stations/'+s+'/observations/latest',NWSH).catch(()=>null);
      if(o&&o.properties&&o.properties.temperature&&o.properties.temperature.value!=null){p=o.properties;g=o.geometry;id=s;break}}
    if(!p){setObs('<span class="mut">Local obs unavailable</span>');return}
    const v=k=>p[k]?p[k].value:null,F=c=>c==null?null:c*9/5+32,M=k=>k==null?null:k/1.609344;
    const d=g&&g.coordinates?miles(LAT,LON,g.coordinates[1],g.coordinates[0]):null;
    const ws=M(v('windSpeed')),wg=M(v('windGust')),wd=v('windDirection'),rh=v('relativeHumidity');
    const ageM=(Date.now()-Date.parse(p.timestamp))/60e3,age=ageM<60?Math.round(ageM)+'m ago':(ageM/60).toFixed(ageM<600?1:0).replace('.0','')+'h ago';
    const wind=ws==null?null:ws<0.5?'Calm':`${wd!=null?card(wd)+' ':''}${r(ws)}${wg!=null?' g'+r(wg):''}`;
    const parts=[`<b>${id}</b>${d!=null?' '+d.toFixed(1)+' mi':''}`,`<b${tS(F(v('temperature')))}>${r(F(v('temperature')))}°</b>`];
    if(rh!=null)parts.push(r(rh)+'%');if(wind)parts.push(wind);parts.push(`<span class="mut">${age}</span>`);

async function resolveLoc(){
  let want='home';try{want=localStorage.getItem('wxMode')||'home'}catch(e){}
  if(want==='here'){
    if(!('geolocation'in navigator)||!window.isSecureContext)locErr('location needs HTTPS');
    else{
      const pos=await new Promise(res=>navigator.geolocation.getCurrentPosition(p=>res(p),e=>res(e),{timeout:12000,maximumAge:600e3,enableHighAccuracy:false}));
      if(pos&&pos.coords){LOC.mode='here';try{TZ=Intl.DateTimeFormat().resolvedOptions().timeZone||TZ}catch(e){}LAT=pos.coords.latitude;LON=pos.coords.longitude;LOC.name=LAT.toFixed(2)+', '+LON.toFixed(2);
        try{const pt=await getJSON('https://api.weather.gov/points/'+LAT.toFixed(4)+','+LON.toFixed(4),NWSH);LOC.points=pt;
          const rl=pt.properties.relativeLocation&&pt.properties.relativeLocation.properties;if(rl)LOC.name=rl.city+', '+rl.state}catch(e){}}
      else{if(pos&&pos.code===1){try{localStorage.setItem('wxMode','home')}catch(e){}locErr('location denied')}else locErr('location unavailable')}

function whatChanged(){

  const b=base.s,ch=[];
